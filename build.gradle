import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.api.attributes.java.TargetJvmVersion

def buildPropertiesFile = rootProject.file('build.properties')

if (!buildPropertiesFile) {
    throw new GradleException('Missing build.properties')
}

def buildProperties = new Properties()
buildPropertiesFile.withInputStream { buildProperties.load(it) }

def requireBuildProperty = { String propertyName ->
    def propertyValue = buildProperties.getProperty(propertyName)?.trim()
    if (!propertyValue) {
        throw new GradleException("Missing ${propertyName} in ${buildPropertiesFile}")
    }
    propertyValue
}

def isTruthy = { String value ->
    if (value == null) {
        return true
    }

    value.trim().toLowerCase(Locale.ROOT) == 'true'
}

def releaseName = requireBuildProperty('name')
def releaseGroup = requireBuildProperty('group')
def releaseVersion = requireBuildProperty('version')
def releaseBuildNumber = System.getenv('GITHUB_RUN_NUMBER')?.trim() ?: '0'
def releaseIsSnapshot = isTruthy(System.getenv('IS_SNAPSHOT'))
def releaseFullVersion = (releaseIsSnapshot ? "${releaseVersion}-SNAPSHOT-${releaseBuildNumber}" : releaseVersion).toString()

group = releaseGroup
version = releaseFullVersion

ext {
    modName = releaseName
    modVersion = releaseVersion
    modBuildNumber = releaseBuildNumber
    modFullVersion = releaseFullVersion
    releaseArchiveBaseName = "${releaseName}_Universal".toString()
}

def macroValues = {
    [
            modVersion     : rootProject.ext.modVersion.toString(),
            modFullVersion : rootProject.ext.modFullVersion.toString(),
            modBuildNumber : rootProject.ext.modBuildNumber.toString()
    ]
}

def javaMacroTokens = {
    def values = macroValues()
    [
            MOD_VERSION      : values.modVersion,
            MOD_FULL_VERSION : values.modFullVersion,
            MOD_BUILD_NUMBER : values.modBuildNumber
    ]
}

def resourceMacroTokens = {
    macroValues()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'customskinloader.manifest-libraries'

    manifestLibraries {
        // Share Bootstrap's dependency set with all packaged child modules.
        add 'https://raw.githubusercontent.com/PrismLauncher/meta-launcher/refs/heads/master/net.minecraft/26.1.2.json'
    }

    repositories {
        mavenCentral()
    }

    def generatedJavaDir = layout.buildDirectory.dir('generated/sources/java-macros/main/java').get().asFile

    def generateJavaMacros = tasks.register('generateJavaMacros', Sync) {
        inputs.properties(javaMacroTokens())

        from('src/main/java') {
            include '**/*.java'
            filteringCharset = 'UTF-8'
            filter(ReplaceTokens, tokens: javaMacroTokens())
        }

        into(generatedJavaDir)
    }

    configurations.configureEach { configuration ->
        if (configuration.canBeResolved) {
            configuration.attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    compileJava {
        dependsOn(generateJavaMacros)
        source = generatedJavaDir
    }

    processResources {
        inputs.properties(resourceMacroTokens())
        filteringCharset = 'UTF-8'

        filesMatching(['**/*.json', '**/*.toml', '**/mcmod.info']) {
            filter(ReplaceTokens, beginToken: '${', endToken: '}', tokens: resourceMacroTokens())
        }
    }
}
