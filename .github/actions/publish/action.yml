# Composite action: upload jars to R2/COS, generate and upload JSON metadata
name: Publish
description: Upload built artifacts to object storage and publish JSON metadata

inputs:
  artifact-dir:
    description: Directory containing built artifacts (relative to workspace)
    required: true
  type:
    description: Release type - 'beta' or 'release'
    required: true

runs:
  using: composite
  steps:
    # Generate JSON metadata, upload to R2/COS root, and output CDN URLs
    - name: Generate and upload JSON metadata
      id: publish-files
      shell: pwsh
      run: ./.github/scripts/Publish-Files.ps1 -ArtifactDir '${{ inputs.artifact-dir }}' -Type '${{ inputs.type }}'

    # Refresh Tencent Cloud CDN cache for the JSON files
    - name: Refresh CDN
      uses: linrongda/tencent-cdn-action@v2
      with:
        secret-id: ${{ env.COS_SECRET_ID }}
        secret-key: ${{ env.COS_SECRET_KEY }}
        action: purgeUrls
        paths: ${{ steps.publish-files.outputs.cdn-urls }}
      continue-on-error: true
