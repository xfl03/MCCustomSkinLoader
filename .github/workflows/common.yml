name: Common

on:
  workflow_call:
    inputs:
      type:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: false
      release:
        required: false
        type: boolean
        default: false
      prerelease-tag:
        required: false
        type: string
        default: ""
      prerelease-name:
        required: false
        type: string
        default: ""
      latest-json:
        required: false
        type: string
        default: latest-beta.json
      detail-json:
        required: false
        type: string
        default: detail-beta.json
      is-snapshot:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "25"
          cache: gradle

      - name: Build
        env:
          IS_SNAPSHOT: ${{ inputs['is-snapshot'] }}
        run: ./.github/scripts/build.ps1

      - name: Install publish CLIs
        if: ${{ inputs.publish || inputs.release }}
        run: ./.github/scripts/install-publish-clis.ps1

      - name: Prepare publish artifacts
        id: publish-artifacts
        if: ${{ inputs.publish || inputs.release }}
        env:
          IS_SNAPSHOT: ${{ inputs['is-snapshot'] }}
          PUBLISH_CHANNEL: ${{ inputs.type }}
          LATEST_JSON_NAME: ${{ inputs['latest-json'] }}
          DETAIL_JSON_NAME: ${{ inputs['detail-json'] }}
          R2_BASE_URL: ${{ secrets.R2_BASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ID: ${{ secrets.R2_SECRET_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          TENCENT_CDN_ROOT: ${{ secrets.TENCENT_CDN_ROOT }}
          CLOUDFLARE_CDN_ROOT: ${{ secrets.CLOUDFLARE_CDN_ROOT }}
        run: ./.github/scripts/prepare-publish-artifacts.ps1

      - name: Prepare build artifacts
        if: ${{ !(inputs.publish || inputs.release) }}
        run: ./.github/scripts/prepare-build-artifacts.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomSkinLoader-${{ inputs.type }}-${{ github.run_number }}
          path: build/publish/*

      - name: Write pre-release body
        if: ${{ inputs.publish && inputs['prerelease-tag'] != '' }}
        env:
          BUILD_TYPE: ${{ inputs.type }}
        run: ./.github/scripts/write-prerelease-body.ps1

      - name: Delete previous pre-release assets
        if: ${{ inputs.publish && inputs['prerelease-tag'] != '' }}
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs['prerelease-tag'] }}
          deleteOnlyFromDrafts: false

      - name: Move pre-release tag
        if: ${{ inputs.publish && inputs['prerelease-tag'] != '' }}
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ inputs['prerelease-tag'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub pre-release
        if: ${{ inputs.publish && inputs['prerelease-tag'] != '' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ inputs['prerelease-name'] }}
          tag_name: ${{ inputs['prerelease-tag'] }}
          prerelease: true
          make_latest: false
          body_path: build/publish/release-notes.md
          overwrite_files: true
          files: |
            build/publish/*.jar
            build/publish/*.json

      - name: Publish GitHub release assets
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite_files: true
          files: |
            build/publish/*.jar
            build/publish/*.json

      - name: Publish to CurseForge and Modrinth
        if: ${{ inputs.release }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: idMHQ4n2
          modrinth-featured: true
          modrinth-unfeature-mode: subset
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 286924
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

          name: ${{ steps.publish-artifacts.outputs.mc_publish_name }}
          version: ${{ steps.publish-artifacts.outputs.mc_publish_version }}
          version-type: release
          loaders: |
            ${{ steps.publish-artifacts.outputs.loaders }}
          game-versions: |
            ${{ steps.publish-artifacts.outputs.game_versions }}
          game-version-filter: releases
          java: |
            ${{ steps.publish-artifacts.outputs.java_versions }}

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

          files: |
            build/publish/*.jar
