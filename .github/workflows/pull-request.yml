name: Pull Request
on:
  push:
    branches: [ci/minecraft-smoke]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [15-develop]

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build
        with:
          artifact-name: CustomSkinLoader-PR-${{ github.run_number }}

  compatibility:
    name: Compatibility Test (${{ matrix.minecraft }}, ${{ matrix.modloader }}, Java ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { minecraft: '1.8.9', modloader: forge, java: '8' }
          - { minecraft: '1.12.2', modloader: forge, java: '8' }
          - { minecraft: '1.16.5', modloader: forge, java: '8' }
          - { minecraft: '1.17.1', modloader: fabric, java: '16' }
          - { minecraft: '1.20.1', modloader: forge, java: '17' }
          - { minecraft: '1.20.1', modloader: fabric, java: '17' }
          - { minecraft: '1.20.2', modloader: neoforge, java: '17' }
          - { minecraft: '1.20.6', modloader: neoforge, java: '21' }
          - { minecraft: '1.21.1', modloader: neoforge, java: '21' }
          - { minecraft: '1.21.3', modloader: fabric, java: '21' }
          - { minecraft: '1.21.4', modloader: neoforge, java: '21' }
          - { minecraft: '1.21.10', modloader: neoforge, java: '21' }
          - { minecraft: '1.21.11', modloader: forge, java: '21' }
          - { minecraft: '1.21.11', modloader: fabric, java: '21' }
          - { minecraft: '26.1.2', modloader: fabric, java: '25' }
          - { minecraft: '26.2', modloader: neoforge, java: '25' }
          - { minecraft: '26.2', modloader: fabric, java: '25' }
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/compatibility
        with:
          artifact-name: CustomSkinLoader-PR-${{ github.run_number }}
          minecraft: ${{ matrix.minecraft }}
          modloader: ${{ matrix.modloader }}
          java: ${{ matrix.java }}
